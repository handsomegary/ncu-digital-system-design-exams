name: Verilog simulation and solution checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test_2008.py, test_2009.py, test_2022.py, test_2023.py, test_2024.py, test_book.py]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
      - run: python tools/sync_book.py --check
      - if: matrix.suite == 'test_book.py'
        run: python tools/check_document_companions.py
      - run: python tests/${{ matrix.suite }}
